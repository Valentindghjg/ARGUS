name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install application dependencies
        run: python -m pip install .
      - name: Synthetic-data regression tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --check argus_security/web/app.js
          node --check browser-companion/src/popup.js
          python browser-companion/tests/validate.py
      - name: Build and validate the installed package
        run: |
          python -m pip install 'build==1.6.1'
          python -m build
          python -m venv /tmp/argus-package
          /tmp/argus-package/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/argus-package/bin/python -m argus_security --language en --help
          /tmp/argus-package/bin/python -m argus_security --language de --help
          /tmp/argus-package/bin/argus --language en --help
          /tmp/argus-package/bin/account-finder --language en --help
          /tmp/argus-package/bin/python -m argus_security --data-dir /tmp/installed-demo demo
          /tmp/argus-package/bin/python -m argus_security --data-dir /tmp/installed-demo report
          /tmp/argus-package/bin/python -m argus_security --data-dir /tmp/installed-demo list-accounts

  browser:
    name: German and English browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install .
      - name: Install optional browser test tools
        run: |
          python -m pip install 'playwright==1.64.0'
          python -m playwright install --with-deps chromium
      - name: Run local browser tests with synthetic data
        shell: bash
        run: |
          BROWSER_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python scripts/browser_smoke.py --browser "$BROWSER_PATH"
          python scripts/browser_multi_account.py --browser "$BROWSER_PATH"
