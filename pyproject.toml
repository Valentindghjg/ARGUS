[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-account-finder"
version = "1.8.0"
description = "Offline-first account inventory, local email evidence and Bitwarden security checklists"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<51"]
keywords = ["account-security", "bitwarden", "email", "imap", "privacy", "password-manager"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Natural Language :: German",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Valentindghjg/account-compass"
Repository = "https://github.com/Valentindghjg/account-compass"
Issues = "https://github.com/Valentindghjg/account-compass/issues"
Security = "https://github.com/Valentindghjg/account-compass/security/advisories"

[project.scripts]
account-finder = "account_finder.cli:main"

[tool.setuptools.package-data]
account_finder = ["data/*.json", "data/*.pem", "web/*"]

[tool.setuptools.packages.find]
include = ["account_finder*"]
