[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-account-finder"
version = "1.3.0"
description = "Local account inventory and Bitwarden security checklist"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
account-finder = "account_finder.cli:main"

[tool.setuptools.package-data]
account_finder = ["data/*.json", "web/*"]

[tool.setuptools.packages.find]
include = ["account_finder*"]
