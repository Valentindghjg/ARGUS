name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Synthetic-data regression tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check account_finder/web/app.js
      - name: Build and validate the installed package
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/account-finder-package
          /tmp/account-finder-package/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/account-finder-package/bin/python -m account_finder --language en --help
          /tmp/account-finder-package/bin/python -m account_finder --language de --help
          /tmp/account-finder-package/bin/python -m account_finder --data-dir /tmp/installed-demo demo
          /tmp/account-finder-package/bin/python -m account_finder --data-dir /tmp/installed-demo report

  browser:
    name: German and English browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install optional browser test tools
        run: |
          python -m pip install 'playwright>=1.51,<2'
          python -m playwright install --with-deps chromium
      - name: Run local browser tests with synthetic data
        shell: bash
        run: |
          BROWSER_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          python scripts/browser_smoke.py --browser "$BROWSER_PATH"
