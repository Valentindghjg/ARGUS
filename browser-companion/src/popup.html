<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARGUS Browser Companion</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">ARGUS · LOCAL CHECK</p>
      <h1>Browser Companion</h1>
      <p id="state" class="state" role="status">Checking the active tab…</p>
      <dl id="details" hidden>
        <div><dt>Provider</dt><dd id="provider"></dd></div>
        <div><dt>Catalogue domain</dt><dd id="domain"></dd></div>
      </dl>
      <p id="password-note" hidden></p>
      <div id="actions" class="actions" hidden>
        <button id="copy" type="button">Copy password-management link</button>
        <button id="open" type="button">Open verified link</button>
      </div>
      <p class="notice">Visiting a website never confirms that you have an account there.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
