name: Release files

# Builds and checks the release files and lists their checksums in the run
# summary. For a version tag, a separate job records a signed build provenance
# attestation for the built files (keyless, through Sigstore), and only after
# that a third job publishes the GitHub release with exactly these files and
# the notes from docs/releases/<tag>.md (docs/PUBLISHING.md). A manual run only
# builds and checks.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check, build and list checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Versions, connections and permissions
        run: |
          python scripts/release_check.py
          python browser-companion/tests/validate.py
      - name: Tag names this version
        if: github.ref_type == 'tag'
        run: python scripts/release_check.py tag "$GITHUB_REF_NAME"
      - name: Build with the commit time as timestamp
        run: |
          python -m pip install 'build==1.6.1'
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python -m build
      - name: Checksums
        run: |
          python scripts/release_check.py checksums dist
          {
            echo '## SHA256SUMS'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            python scripts/release_check.py
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the files for the attestation and the release
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest build provenance
    # Only a tag is a release. This job runs no project code and is the only
    # one that may request a signing identity and store an attestation.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*.whl, dist/*.tar.gz'

  publish:
    name: Publish the release
    # Only for a tag and only after the attestation, so the release carries
    # exactly the attested files. This job runs no project code.
    if: github.ref_type == 'tag'
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Publish with the notes from docs/releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          title="$(head -n 1 "$notes")"
          tail -n +2 "$notes" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "${title#"# "}" --notes-file "$RUNNER_TEMP/notes.md"
