[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-account-security"
dynamic = ["version"]
description = "Offline-first account inventory, local email evidence and Bitwarden security checklists"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
license-files = ["LICENSE"]
dependencies = ["cryptography>=42,<51"]
keywords = ["account-security", "bitwarden", "email", "imap", "privacy", "password-manager"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Natural Language :: German",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Valentindghjg/ARGUS"
Repository = "https://github.com/Valentindghjg/ARGUS"
Issues = "https://github.com/Valentindghjg/ARGUS/issues"
Security = "https://github.com/Valentindghjg/ARGUS/security/advisories"

[project.scripts]
argus = "argus_security.cli:main"
# Deprecated alias for profiles and scripts from before the ARGUS rename.
account-finder = "account_finder.__main__:main"

[tool.setuptools.package-data]
# Only the publisher PUBLIC key may ship; private keys are git-ignored.
argus_security = ["data/*.json", "data/license_public_key.pem", "web/*"]

[tool.setuptools.dynamic]
version = {attr = "argus_security.__version__"}

[tool.setuptools.packages.find]
include = ["argus_security*", "account_finder*"]
