name: Release files

# Builds and checks the release files and lists their checksums in the run
# summary. It publishes nothing: the owner creates each GitHub release by hand
# (docs/PUBLISHING.md) and can compare these checksums with a local build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check, build and list checksums
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Versions, connections and permissions
        run: python scripts/release_check.py
      - name: Tag names this version
        if: github.ref_type == 'tag'
        run: python scripts/release_check.py tag "$GITHUB_REF_NAME"
      - name: Build with the commit time as timestamp
        run: |
          python -m pip install 'build==1.6.1'
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python -m build
      - name: Checksums
        run: |
          python scripts/release_check.py checksums dist
          {
            echo '## SHA256SUMS'
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            python scripts/release_check.py
          } >> "$GITHUB_STEP_SUMMARY"
