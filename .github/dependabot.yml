version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # axe-core for the accessibility audit only; never part of the package.
  - package-ecosystem: npm
    directory: /scripts/accessibility
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
